      * {

        padding: 1rem 0.75rem;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .app {
        max-width: 1400px;
        width: 100%;
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
        padding: 2rem 2rem 2.5rem;
        transition: box-shadow 0.3s ease;
      }

      /* ----- 標題區 ----- */
      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.75rem;
        gap: 1rem;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .header-left h1 {
        font-size: 1.8rem;
        font-weight: 600;
        color: #0b1e33;
        letter-spacing: 0.5px;
      }

      .header-left .badge {
        background: #eef3fa;
        color: #1f4a7a;
        font-size: 0.85rem;
        font-weight: 500;
        padding: 0.2rem 0.9rem;
        border-radius: 20px;
        white-space: nowrap;
      }

      .header-right {
        font-size: 0.9rem;
        color: #4a637f;
        background: #f0f4fa;
        padding: 0.4rem 1.2rem;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .header-right span {
        font-weight: 600;
        color: #0b1e33;
      }

      /* ----- 搜尋欄 ----- */
      .search-section {
        background: #f8faff;
        border-radius: 18px;
        padding: 1.5rem 1.8rem;
        margin-bottom: 2rem;
        border: 1px solid #e6edf6;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem 1.2rem;
        transition: border-color 0.2s;
      }

      .search-section:focus-within {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
      }

      .search-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        color: #1f3a5e;
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .search-label .icon {
        font-size: 1.2rem;
      }

      .search-input-wrapper {
        flex: 1;
        min-width: 200px;
        position: relative;
      }

      .search-input-wrapper input {
        width: 100%;
        padding: 0.75rem 1.2rem;
        border: 1px solid #d9e2ef;
        border-radius: 60px;
        font-size: 1rem;
        background: #ffffff;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
        color: #0b1e33;
      }

      .search-input-wrapper input::placeholder {
        color: #8aa1bc;
      }

      .search-input-wrapper input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .search-actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.7rem 1.6rem;
        border: none;
        border-radius: 60px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }

      .btn-primary {
        background: #1a4d7a;
        color: white;
      }

      .btn-primary:hover {
        background: #0e3a60;
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(26, 77, 122, 0.25);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: #e9eff7;
        color: #1f3a5e;
      }

      .btn-secondary:hover {
        background: #dce5f0;
      }

      /* ----- 結果統計 ----- */
      .result-stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-bottom: 1.25rem;
        padding: 0 0.2rem;
      }

      .result-stats .count {
        font-size: 0.95rem;
        color: #2c4c72;
      }

      .result-stats .count strong {
        color: #0b1e33;
        font-weight: 700;
      }

      .result-stats .hint {
        font-size: 0.85rem;
        color: #7a94b2;
      }

      /* ----- 表格容器 ----- */
      .table-wrap {
        overflow-x: auto;
        border-radius: 16px;
        border: 1px solid #e9eff5;
        background: #ffffff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
        min-width: 700px;
      }

      thead {
        background: #f2f6fd;
        border-bottom: 2px solid #dce5f0;
      }

      thead th {
        padding: 0.9rem 1rem;
        text-align: left;
        font-weight: 600;
        color: #1f3a5e;
        white-space: nowrap;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }

      thead th:first-child {
        border-radius: 12px 0 0 0;
      }
      thead th:last-child {
        border-radius: 0 12px 0 0;
      }

      tbody tr {
        border-bottom: 1px solid #edf2f9;
        transition: background 0.15s;
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody tr:hover {
        background: #f8fbff;
      }

      tbody td {
        padding: 0.8rem 1rem;
        color: #1b314a;
        vertical-align: middle;
        line-height: 1.5;
      }

      tbody td .highlight {
        background: #fde68a;
        padding: 0 2px;
        border-radius: 3px;
        font-weight: 500;
      }

      .col-item {
        font-weight: 600;
        color: #0b1e33;
        white-space: nowrap;
        font-size: 0.85rem;
      }

      .col-floor {
        white-space: nowrap;
        font-weight: 500;
        color: #1f4a7a;
      }

      .col-location {
        min-width: 180px;
      }

      .col-date {
        white-space: nowrap;
        font-size: 0.8rem;
        color: #4a637f;
      }

      .col-remarks {
        font-size: 0.85rem;
        color: #4a637f;
        max-width: 200px;
        word-break: break-word;
      }

      .col-remarks:empty::before {
        content: "—";
        color: #bcc9db;
      }

      /* ----- 空狀態 ----- */
      .empty-state {
        padding: 3.5rem 1.5rem;
        text-align: center;
        color: #6d8aac;
      }

      .empty-state .big-icon {
        font-size: 3rem;
        display: block;
        margin-bottom: 0.8rem;
      }

      .empty-state p {
        font-size: 1.05rem;
        margin-bottom: 0.3rem;
      }

      .empty-state .sub {
        font-size: 0.9rem;
        color: #8aa3c0;
      }

      /* ----- 響應式 ----- */
      @media (max-width: 768px) {
        body {
          padding: 0.25rem 0.2rem;
        }
        .app {
          padding: 0.6rem 1rem 0.9rem;
          border-radius: 20px;
        }
        .header {
          flex-direction: column;
          align-items: flex-start;
        }
        .header-left h1 {
          font-size: 1.4rem;
        }
        .header-right {
          font-size: 0.8rem;
          padding: 0.3rem 1rem;
        }
        .search-section {

          flex-direction: column;
          align-items: stretch;
        }
        .search-label {
          font-size: 0.9rem;
        }
        .search-input-wrapper input {
          padding: 0.65rem 1rem;
          font-size: 0.95rem;
        }
        .search-actions {

        }
        .search-actions .btn {

          justify-content: center;
          padding: 0.6rem 1rem;
          font-size: 0.9rem;
        }
        .result-stats {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.3rem;
        }
        table {

        thead th,

        }
        .col-item {
          font-size: 0.8rem;
        }
        .col-date {
          font-size: 0.72rem;

        thead th,

      // ================================================================
      //  2. DOM 引用
      // ================================================================
      const searchInput = document.getElementById("searchInput");
      const searchBtn = document.getElementById("searchBtn");
      const resetBtn = document.getElementById("resetBtn");
      const resultBody = document.getElementById("resultBody");
      const totalCount = document.getElementById("totalCount");
      const resultCount = document.getElementById("resultCount");
      const searchHint = document.getElementById("searchHint");

      // ================================================================
      //  3. 輔助函數
      // ================================================================
      // 標準化樓層字串：移除斜槓、轉大寫
      function normalizeFloor(str) {
        return str.replace(/\//g, "").toUpperCase();
      }

      // ================================================================
      //  4. 渲染函數 (支援高亮)
      // ================================================================
      function render(records, keyword) {
        totalCount.textContent = DATA.length;

        if (records.length === 0) {
          resultBody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <span class="big-icon">🔎</span>
                                <p>沒有找到匹配的記錄</p>
                                <div class="sub">試試其他關鍵字，或點擊「重置」顯示全部</div>
                            </div>
                        </td>
                    </tr>
                `;
          resultCount.textContent = "0";
          searchHint.textContent = "💡 沒有匹配結果，請調整關鍵字";
          return;
        }

        const kw = keyword ? keyword.trim() : "";
        const kwLower = kw.toLowerCase();
        // 用於 floor 比對的標準化關鍵字 (移除斜槓、大寫)
        const kwFloorNorm = normalizeFloor(kw);

        let html = "";
        for (const r of records) {
          const itemRaw = r.item;
          const floorRaw = r.floor;
          const locRaw = r.location;
          const dateRaw = r.date;
          const remRaw = r.remarks || "";

          // 高亮處理 (只針對搜尋關鍵字)
          const highlight = (text) => {
            if (!kwLower || !text) return text;
            const lower = text.toLowerCase();
            if (!lower.includes(kwLower)) return text;
            const regex = new RegExp(
              kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
              "gi",
            );
            return text.replace(
              regex,
              (match) => `<span class="highlight">${match}</span>`,
            );
          };

          // 對樓層做特別高亮：因為使用者可能輸入 "1F" 而數據是 "1/F"，要能高亮
          // 簡單策略：如果 floorRaw 包含關鍵字（忽略斜槓），則高亮整個樓層
          let floorDisplay = floorRaw;
          if (kwLower && normalizeFloor(floorRaw).includes(kwFloorNorm)) {
            // 高亮整個樓層（因為格式可能不同，直接高亮原始值）
            floorDisplay = `<span class="highlight">${floorRaw}</span>`;
          }

          const itemDisplay = highlight(itemRaw);
          const locDisplay = highlight(locRaw);
          const remDisplay = highlight(remRaw);

          html += `
                    <tr>
                        <td class="col-item">${itemDisplay}</td>
                        <td class="col-floor">${floorDisplay}</td>
                        <td class="col-location">${locDisplay}</td>
                        <td class="col-date">${dateRaw}</td>
                        <td class="col-remarks">${remDisplay || ""}</td>
                    </tr>
                `;
        }

        resultBody.innerHTML = html;
        resultCount.textContent = records.length;

        if (kwLower) {
          searchHint.textContent = `🔍 搜尋「${kw}」共 ${records.length} 筆結果`;
        } else {
          searchHint.textContent = "📋 顯示全部記錄 · 輸入關鍵字可篩選";
        }
      }

      // ================================================================
      //  5. 搜尋邏輯 (跨欄位模糊匹配，樓層支援斜槓省略)
      // ================================================================
      function performSearch() {
        const raw = searchInput.value;
        const keyword = raw.trim();
        const kwLower = keyword.toLowerCase();
        const kwFloorNorm = normalizeFloor(keyword); // 用於樓層比對

        if (!kwLower) {
          render(DATA, "");
          return;
        }

        const filtered = DATA.filter((r) => {
          // 一般欄位：item, location, remarks (小寫包含)
          const itemMatch = r.item.toLowerCase().includes(kwLower);
          const locMatch = r.location.toLowerCase().includes(kwLower);
          const remMatch = (r.remarks || "").toLowerCase().includes(kwLower);

          // 樓層欄位：標準化後包含
          const floorMatch = normalizeFloor(r.floor).includes(kwFloorNorm);

          return itemMatch || floorMatch || locMatch || remMatch;
        });

        render(filtered, keyword);
      }

      // ================================================================
      //  6. 重置
      // ================================================================
      function resetSearch() {
        searchInput.value = "";
        render(DATA, "");
        searchInput.focus();
      }

      // ================================================================
      //  7. 事件綁定
      // ================================================================
      searchBtn.addEventListener("click", performSearch);

      resetBtn.addEventListener("click", resetSearch);

      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          performSearch();
        }
      });

      let debounceTimer = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          performSearch();
        }, 300);
      });

      // ================================================================
      //  8. 初始化
      // ================================================================
      render(DATA, "");
    </script>
